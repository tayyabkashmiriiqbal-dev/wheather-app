<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>weather-app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="on">

      <h1 class="temp"></h1>
      <img src="" id="weather-icon" alt="">
      <form onsubmit="addwheather(event)">
        <input class="input" type="text" />
        <button class="but">search</button>
      </form>
      <p class="humidity"></p>
      <p class="rain"></p>
      <p class="time"></p>
      <p class="feels-like"></p>
      <p class="condition"></p>
      <p class="country"></p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.17.0/dist/axios.min.js"></script>
    <script src="app.js"></script> 
     
  </body>
</html>
